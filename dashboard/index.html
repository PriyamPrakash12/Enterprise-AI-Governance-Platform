<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enterprise AI Governance Platform</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">
        Enterprise AI Governance Platform
    </h2>

    <div class="card p-4 shadow">

        <h5>Prompt Analyzer</h5>

        <textarea
            id="prompt"
            class="form-control mt-3"
            rows="6"
            placeholder="My aadhaar number is 1234 5678 9012">
        </textarea>

        <div class="form-check form-switch mt-3">

            <input
                class="form-check-input"
                type="checkbox"
                id="sanitizeMode">

            <label
                class="form-check-label"
                for="sanitizeMode">

                Automatically sanitize prompt instead of blocking

            </label>

        </div>

        <button
            class="btn btn-primary mt-3"
            onclick="analyzePrompt()">

            Analyze

        </button>

    </div>

    <div class="card mt-4 p-4 shadow">

        <h4>Analysis Result</h4>

        <p><b>Risk:</b> <span id="risk"></span></p>

        <p><b>Decision:</b> <span id="decision"></span></p>

        <p><b>Contains PII:</b> <span id="pii"></span></p>

        <p><b>Categories:</b> <span id="categories"></span></p>

        <p><b>Reason:</b> <span id="reason"></span></p>

        <p id="sanitizedSection" style="display:none;">

            <b>Sanitized Prompt:</b>

            <span id="sanitized"></span>

        </p>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
